
<!DOCTYPE html>
<header lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة دليل جامعة نجران الأكاديمي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .hero-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <!-- شريط التنقل العلوي (طابع منصة تعليمية) -->
    <header class="hero-gradient text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-white/10 p-3 rounded-2xl text-2xl">🎓</div>
                <div>
                    <h1 class="text-xl font-bold">دليل جامعة نجران الأكاديمي</h1>
                    <p class="text-xs text-blue-200">المرجع الشامل لأعضاء هيئة التدريس والقيادات</p>
                </div>
            </div>
            <!-- تبديل الأقسام -->
            <div class="bg-black/20 p-1.5 rounded-xl flex gap-1">
                <button onclick="switchCategory('doctor')" id="tab-doctor" class="px-4 py-2 rounded-lg text-sm font-bold bg-white text-blue-900 shadow transition">أعضاء التدريس</button>
                <button onclick="switchCategory('head')" id="tab-head" class="px-4 py-2 rounded-lg text-sm font-bold text-white hover:bg-white/10 transition">العمداء والرؤساء</button>
            </div>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

        <!-- شريط البحث السريع والذكي -->
        <div class="relative">
            <input type="text" id="searchInput" oninput="filterData()" placeholder="ابحث باسم الأستاذ، الكلية، أو التخصص..." 
                class="w-full p-4 pr-12 rounded-2xl border border-slate-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 bg-white text-slate-900 text-sm font-medium">
            <span class="absolute right-4 top-4 text-xl text-slate-400">🔍</span>
        </div>

        <!-- تصفية الكليات (أزرار أفقية تفاعلية) -->
        <div>
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">التصفية حسب الكلية</h2>
            <div id="collegesFilter" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
                <button onclick="filterByCollege('')" id="col-all" class="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm whitespace-nowrap transition">جميع الكليات</button>
                <!-- تُعبأ ديناميكياً -->
            </div>
        </div>

        <!-- عداد النتائج -->
        <div class="flex justify-between items-center text-xs text-slate-500 px-1">
            <span id="resultsCount">جاري تحميل البيانات...</span>
            <span>جامعة نجران KSA</span>
        </div>

        <!-- شبكة عرض النتائج (Cards) -->
        <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- تُعبأ ديناميكياً -->
        </div>

    </main>

    <!-- الفوتر -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200 mt-12">
        جميع الحقوق محفوظة © إدارة مجموعة جامعة نجران
    </footer>

    <script>
        let doctorsData = [];
        let collegesData = [];
        let currentCategory = 'doctor';
        let selectedCollege = '';

        // تهيئة التيليجرام ويب أب لو فُتح كـ Mini App
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.expand();
        }

        async function init() {
            try {
                // جلب البيانات من ملفات الجايسون المحلية في المستودع
                let [docRes, colRes] = await Promise.all([
                    fetch('doctors_data.json'),
                    fetch('colleges.json')
                ]);
                doctorsData = await docRes.json();
                collegesData = await colRes.json();

                renderCollegesFilter();
                filterData();
            } catch (e) {
                document.getElementById('resultsContainer').innerHTML = `
                    <div class="col-span-full bg-red-50 text-red-600 p-4 rounded-2xl text-center text-sm font-bold">
                        تعذّر تحميل ملفات البيانات (JSON). تأكد من رفع ملفات doctors_data.json و colleges.json بجانب هذا الملف.
                    </div>
                `;
            }
        }

        function renderCollegesFilter() {
            let container = document.getElementById('collegesFilter');
            collegesData.forEach(c => {
                let btn = document.createElement('button');
                btn.id = `col-${c.name}`;
                btn.className = "px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 shadow-sm whitespace-nowrap hover:bg-slate-50 transition";
                btn.innerText = c.name;
                btn.onclick = () => filterByCollege(c.name);
                container.appendChild(btn);
            });
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.getElementById('tab-doctor').className = cat === 'doctor' 
                ? "px-4 py-2 rounded-lg text-sm font-bold bg-white text-blue-900 shadow transition" 
                : "px-4 py-2 rounded-lg text-sm font-bold text-white hover:bg-white/10 transition";
            document.getElementById('tab-head').className = cat === 'head' 
                ? "px-4 py-2 rounded-lg text-sm font-bold bg-white text-blue-900 shadow transition" 
                : "px-4 py-2 rounded-lg text-sm font-bold text-white hover:bg-white/10 transition";
            filterData();
        }

        function filterByCollege(collegeName) {
            selectedCollege = collegeName;
            
            // تحديث تصميم الأزرار
            document.getElementById('col-all').className = selectedCollege === '' 
                ? "px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm whitespace-nowrap transition" 
                : "px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 shadow-sm whitespace-nowrap hover:bg-slate-50 transition";
            
            collegesData.forEach(c => {
                let btn = document.getElementById(`col-${c.name}`);
                if(btn) {
                    btn.className = selectedCollege === c.name 
                        ? "px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white shadow-sm whitespace-nowrap transition" 
                        : "px-4 py-2 rounded-xl text-xs font-bold bg-white text-slate-600 border border-slate-200 shadow-sm whitespace-nowrap hover:bg-slate-50 transition";
                }
            });

            filterData();
        }

        function filterData() {
            let query = document.getElementById('searchInput').value.trim().toLowerCase();
            
            let filtered = doctorsData.filter(d => {
                let matchCat = (d.category || 'doctor') === currentCategory;
                let matchCollege = selectedCollege === '' || d.college === selectedCollege;
                
                let matchQuery = true;
                if(query) {
                    matchQuery = (d.name && d.name.toLowerCase().includes(query)) ||
                                 (d.college && d.college.toLowerCase().includes(query)) ||
                                 (d.major && d.major.toLowerCase().includes(query)) ||
                                 (d.rank && d.rank.toLowerCase().includes(query));
                }
                return matchCat && matchCollege && matchQuery;
            });

            renderResults(filtered);
        }

        function renderResults(items) {
            let container = document.getElementById('resultsContainer');
            document.getElementById('resultsCount').innerText = `عدد النتائج: ${items.length} عضو`;
            container.innerHTML = '';

            if(items.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <p class="text-slate-400 text-sm font-semibold">لا توجد نتائج مطابقة لبحثك</p>
                    </div>
                `;
                return;
            }

            items.forEach(doc => {
                let emailsHtml = '';
                if(doc.emails && doc.emails.length > 0) {
                    emailsHtml = doc.emails.map(e => `
                        <a href="mailto:${e.email}" class="inline-flex items-center gap-1.5 text-xs font-mono bg-blue-50 text-blue-700 px-3 py-1.5 rounded-xl hover:bg-blue-100 transition">
                            <span>📧</span> ${e.email} ${e.label ? '('+e.label+')' : ''}
                        </a>
                    `).join('');
                } else {
                    emailsHtml = '<span class="text-xs text-slate-400">لا يوجد بريد مسجل</span>';
                }

                let card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between gap-4";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h3 class="font-bold text-slate-900 text-base">${doc.name}</h3>
                            <span class="text-[10px] font-bold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600">${doc.rank || 'أعضاء هيئة التدريس'}</span>
                        </div>
                        <div class="space-y-1 text-xs text-slate-600">
                            <p class="flex items-center gap-1.5"><span>🏛️</span> ${doc.college || 'غير محدد'}</p>
                            ${doc.major ? `<p class="flex items-center gap-1.5"><span>📚</span> ${doc.major}</p>` : ''}
                        </div>
                    </div>
                    <div class="pt-3 border-t border-slate-100 flex flex-wrap gap-2">
                        ${emailsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        init();
    </script>
</body>
</html>
