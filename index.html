<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دليل أعضاء هيئة التدريس</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS (xlsx) لقراءة ملفات الإكسل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* إعدادات خط عربي جميل */
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            /* خلفية متدرجة حديثة تتناسب مع الوضعين */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        /* الوضع الليلي لتطبيق تيليجرام */
        body.dark-theme {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
        }

        /* التأثير الزجاجي (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        body.dark-theme .glass-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* تنسيق حقول الإدخال لتناسب التأثير الزجاجي */
        .glass-input {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: #333;
        }
        
        body.dark-theme .glass-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        
        body.dark-theme .glass-input option {
            background: #1e293b;
            color: #fff;
        }
    </style>
</head>
<body class="p-4 text-slate-800">

    <!-- حاوية التطبيق -->
    <div class="max-w-2xl mx-auto">
        
        <!-- الترويسة -->
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold mb-2">دليل أعضاء هيئة التدريس</h1>
            <p class="text-sm opacity-80" id="userNameDisplay">مرحباً بك في الدليل الأكاديمي</p>
        </header>

        <!-- قسم رفع ملف الإكسل (للمسؤول أو للتجربة) -->
        <div class="glass-card rounded-2xl p-4 mb-6">
            <label class="block text-sm font-semibold mb-2">قم برفع ملف الإكسل (بيانات الدكاترة):</label>
            <input type="file" id="excelFileInput" accept=".xlsx, .xls" 
                   class="block w-full text-sm text-slate-500
                          file:mr-4 file:py-2 file:px-4
                          file:rounded-xl file:border-0
                          file:text-sm file:font-semibold
                          file:bg-blue-50 file:text-blue-700
                          hover:file:bg-blue-100 cursor-pointer">
        </div>

        <!-- أدوات البحث والفلترة -->
        <div class="glass-card rounded-2xl p-4 mb-6 flex flex-col md:flex-row gap-3">
            <!-- شريط البحث -->
            <div class="flex-1">
                <input type="text" id="searchInput" placeholder="ابحث بالاسم..." 
                       class="glass-input w-full p-3 rounded-xl outline-none transition focus:ring-2 focus:ring-blue-400">
            </div>
            <!-- الفلترة بالقسم -->
            <div class="flex-1">
                <select id="departmentFilter" class="glass-input w-full p-3 rounded-xl outline-none transition focus:ring-2 focus:ring-blue-400">
                    <option value="all">جميع الأقسام</option>
                    <!-- سيتم إضافة الأقسام هنا برمجياً -->
                </select>
            </div>
        </div>

        <!-- منطقة عرض البطاقات -->
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- رسالة مبدئية -->
            <div class="col-span-full text-center p-8 glass-card rounded-2xl opacity-70">
                يرجى رفع ملف الإكسل لعرض البيانات...
            </div>
        </div>

    </div>

    <script>
        // المتغيرات العامة
        let allFacultyData = []; // لتخزين جميع البيانات المستخرجة من الإكسل
        const tg = window.Telegram.WebApp;

        // تهيئة تطبيق تيليجرام
        function initTelegramApp() {
            tg.expand(); // توسيع التطبيق لملء الشاشة
            
            // تفعيل الوضع الليلي بناءً على ثيم تيليجرام
            if (tg.colorScheme === 'dark') {
                document.body.classList.add('dark-theme');
            }
            
            // عرض اسم المستخدم إن وجد
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                document.getElementById('userNameDisplay').innerText = `مرحباً بك يا ${tg.initDataUnsafe.user.first_name}`;
            }
        }

        // قراءة ملف الإكسل
        document.getElementById('excelFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                
                // نفترض أن البيانات في الورقة الأولى (Sheet1)
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // تحويل الورقة إلى مصفوفة كائنات (JSON)
                allFacultyData = XLSX.utils.sheet_to_json(worksheet);
                
                // استخراج الأقسام للفلتر
                populateDepartments(allFacultyData);
                
                // عرض البطاقات
                renderCards(allFacultyData);
            };
            reader.readAsArrayBuffer(file);
        });

        // استخراج الأقسام الفريدة وإضافتها للقائمة المنسدلة
        function populateDepartments(data) {
            const filterSelect = document.getElementById('departmentFilter');
            // تفريغ القائمة مع الاحتفاظ بخيار "الكل"
            filterSelect.innerHTML = '<option value="all">جميع الأقسام</option>';
            
            // استخراج الأقسام بدون تكرار (بافتراض أن العمود في الإكسل اسمه "القسم")
            const departments = [...new Set(data.map(item => item['القسم']).filter(Boolean))];
            
            departments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept;
                option.textContent = dept;
                filterSelect.appendChild(option);
            });
        }

        // دالة عرض البطاقات
        function renderCards(data) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = ''; // مسح المحتوى القديم

            if (data.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center p-4 glass-card rounded-xl">لا توجد نتائج مطابقة.</div>';
                return;
            }

            data.forEach(person => {
                // بافتراض أن أعمدة الإكسل هي: الاسم, القسم, البريد, المكتب
                const name = person['الاسم'] || 'غير متوفر';
                const department = person['القسم'] || 'غير متوفر';
                const email = person['البريد'] || person['البريد الإلكتروني'] || 'غير متوفر';
                const office = person['المكتب'] || 'غير متوفر';

                const cardHTML = `
                    <div class="glass-card p-5 rounded-2xl transition hover:-translate-y-1 hover:shadow-lg">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-12 h-12 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-xl">
                                ${name.charAt(0)}
                            </div>
                            <div>
                                <h3 class="font-bold text-lg leading-tight">${name}</h3>
                                <span class="text-xs px-2 py-1 bg-blue-500/20 text-blue-700 dark:text-blue-300 rounded-full inline-block mt-1">${department}</span>
                            </div>
                        </div>
                        <div class="text-sm space-y-2 opacity-90 mt-4">
                            <p class="flex items-center gap-2">
                                ✉️ <a href="mailto:${email}" class="hover:underline">${email}</a>
                            </p>
                            <p class="flex items-center gap-2">
                                🏢 المكتب: ${office}
                            </p>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // دالة الفلترة المدمجة (بحث بالنص + تصفية بالقسم)
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedDept = document.getElementById('departmentFilter').value;

            const filteredData = allFacultyData.filter(person => {
                const name = (person['الاسم'] || '').toLowerCase();
                const dept = person['القسم'] || '';
                
                const matchesSearch = name.includes(searchTerm);
                const matchesDept = (selectedDept === 'all') || (dept === selectedDept);
                
                return matchesSearch && matchesDept;
            });

            renderCards(filteredData);
        }

        // ربط أحداث الإدخال بالفلترة
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('departmentFilter').addEventListener('change', applyFilters);

        // تشغيل التطبيق
        initTelegramApp();

    </script>
</body>
</html>
